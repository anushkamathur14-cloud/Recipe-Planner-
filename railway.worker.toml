# Worker service: Root Directory = repo root. In Railway → Settings → Config-as-code → railway.worker.toml
# (If omitted, root Dockerfile still builds worker when RAILWAY_SERVICE_NAME contains "worker".)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
startCommand = "node apps/worker/dist/index.js"
restartPolicyType = "ON_FAILURE"
# Railway may use /api/health or /health — worker responds to both
healthcheckPath = "/api/health"
