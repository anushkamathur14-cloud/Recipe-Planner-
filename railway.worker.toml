# Worker service: Root Directory MUST be repo root (leave blank in Railway UI)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
startCommand = "node apps/worker/dist/index.js"
restartPolicyType = "ON_FAILURE"
# Railway may use /api/health or /health — worker responds to both
healthcheckPath = "/api/health"
