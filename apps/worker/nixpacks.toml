# Used when Railway Root Directory is wrongly set to apps/worker — runs from monorepo root
[phases.setup]
nixPkgs = ["nodejs_22", "openssl", "ffmpeg", "python311"]

[phases.install]
cmds = [
  "cd ../.. && npm ci --ignore-scripts",
  "pip3 install --break-system-packages yt-dlp 2>/dev/null || pip3 install yt-dlp",
]

[phases.build]
cmds = [
  "cd ../.. && node scripts/prisma-generate.cjs",
  "cd ../.. && npm run build --workspace=@recipe-planner/shared",
  "cd ../.. && npm run build --workspace=@recipe-planner/db",
  "cd ../.. && npm run build --workspace=@recipe-planner/worker",
]

[start]
cmd = "cd ../.. && node apps/worker/dist/index.js"
